# Render Blueprint - Backend de Lakeside Serenity (escapelakenorman-api)
#
# URL activa:
#   https://escapelakenorman-api-l2da.onrender.com
#
# SQLite persistence rollout (Issue #23):
#   1. BEFORE any deploy/Blueprint sync, inventory and back up the current live
#      server/reservations.db off-service. The current filesystem is ephemeral.
#   2. This Blueprint declares a dedicated 1 GB persistent disk at /var/data.
#   3. RESERVATIONS_DB_PATH is intentionally NOT managed by this Blueprint.
#      After the current DB has been restored/copied to
#      /var/data/reservations.db and verified, set RESERVATIONS_DB_PATH manually
#      in the Render Dashboard to /var/data/reservations.db and redeploy.
#      Omitting it here prevents a later Blueprint sync from silently resetting
#      the cutover value.
#   4. Follow docs/ISSUE-23-RENDER-SQLITE-CUTOVER.md for verification/rollback.

services:
  - type: web
    name: escapelakenorman-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm rebuild sqlite3 --build-from-source
    startCommand: node server/index.js
    healthCheckPath: /health

    # Dedicated persistent data volume. Never mount over application source.
    disk:
      name: escapelakenorman-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

      # Frontend (Netlify): de aquí salen success.html / cancel.html.
      # DOMAIN es la versión "canónica" del sitio (a donde Stripe redirige).
      - key: DOMAIN
        value: https://www.escapelakenorman.com
      # CORS: lista separada por comas con TODOS los orígenes válidos
      # (raíz y www, porque Netlify suele responder en ambos).
      - key: ALLOWED_ORIGINS
        value: https://escapelakenorman.com,https://www.escapelakenorman.com

      # Seguridad: el servidor NO arranca sin estas dos (process.exit)
      - key: ADMIN_PASSWORD
        sync: false # el cliente la escribe en el panel de Render
      - key: JWT_SECRET
        generateValue: true # Render genera un secreto aleatorio seguro

      # Stripe: el cliente las rellena cuando complete su cuenta.
      # Mientras estén vacías y MOCK_PAYMENTS=false, el endpoint de pago
      # devuelve 503 "Payments are not configured" (no rompe el sitio).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Pagos simulados: útil SOLO mientras el cliente verifica el flujo.
      # En cuanto pongan las claves reales de Stripe, ponerlo en false.
      # OJO: con NODE_ENV=production este modo se ignora siempre (blindado),
      # así que para la demo con pagos falsos usa NODE_ENV=development.
      - key: MOCK_PAYMENTS
        value: "false"

      # Calendario de Airbnb (iCal exportado desde el panel del anfitrión)
      - key: AIRBNB_ICAL_URL
        sync: false # la pega el cliente desde Airbnb > Calendario > Exportar

      # Tarifa de limpieza (USD). 0 = sin cleaning fee.
      - key: CLEANING_FEE
        value: "0"
