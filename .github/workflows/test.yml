name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild sqlite3 from source
        run: npm rebuild sqlite3 --build-from-source
      - name: Verify sqlite3 native load
        run: node -e "require('sqlite3'); console.log('sqlite3 native load ok')"
      - name: Audit production dependencies
        run: npm audit --audit-level=high
      - name: Run test suite
        run: npm test
