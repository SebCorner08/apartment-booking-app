name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify manifest and lockfile runtime metadata
        run: node -e "const pkg=require('./package.json'); const lock=require('./package-lock.json'); if (pkg.engines.node !== lock.packages[''].engines.node) { console.error('package.json and package-lock.json engines.node differ'); process.exit(1); }"
      - run: npm ci
      - name: Rebuild sqlite3 from source
        run: npm rebuild sqlite3 --build-from-source
      - name: Verify sqlite3 native load
        run: node -e "require('sqlite3'); console.log('sqlite3 native load ok')"
      - name: Audit production dependencies
        run: npm audit --audit-level=high
      - name: Run test suite
        run: npm test
